num_iterations: 1     # iterations for each config
starting_iteration: 0 # start id of iteration
exp_id: AE_MKAN_Polar_ManySig         # id of current run
logs_dir: logs        # dir for logs
report_interval: 10   # report interval

# dataset specification

dataset:
  name: WiSig_ManySig
  config:
    file:  ManySig.pkl
    polars: True
    k_fold: 
      total_devices: 6
      ratio: 6
    selected_receivers: !!python/tuple [0,]
    test_config:
      type: validation
    train_config:
      type: train

# train and test loaders
train_loader:
  num_workers: 10
  batch_size: 50
  shuffle: true

test_loader:
  num_workers: 10
  batch_size: 50
  shuffle: false

# specifications for metrics computing
evaluation:
  clusters_numbers: !!python/tuple [80] # for which numbers of clusters calculate metrics

# specifications for approach and trainer parameters
approach:
  name: AE
  config:
    noise_std: 0.01
    device: cpu
    num_epochs: 100
  trainer:
    main_optimizer:
      name: Adam
      config:
        lr: 0.001

# specifications for feature_extractor
# KAN

feature_extractor:
  name: AE_MKAN
  config:
    input_size: 512
    hidden_size: 3
    polars: True
    monotonic: True